version: '3.8'

services:
  gateway:
    build: .
    container_name: pet-iot-edge-gateway
    restart: unless-stopped
    environment:
      - GATEWAY_ID=${GATEWAY_ID:-gateway-01}
      - KENNEL_ID=${KENNEL_ID:-kennel-01}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - LOCAL_BACKEND_URL=http://local-backend:3000
      - CLOUD_BACKEND_URL=${CLOUD_BACKEND_URL:-https://api.petsmart.example.com}
      - API_KEY=${API_KEY:-smart-pet-api-key-2026}
      - SQLITE_PATH=/app/data/gateway.db
      - SYNC_INTERVAL=30000
      - HEARTBEAT_INTERVAL=60000
    volumes:
      - ./data:/app/data
    networks:
      - iot-network
    depends_on:
      - mosquitto
      - local-backend

  # Local Backend (Edge mode)
  local-backend:
    image: node:20-alpine
    container_name: pet-local-backend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm run dev"
    environment:
      - PORT=3000
      - BACKEND_MODE=edge
      - CLOUD_BACKEND_URL=${CLOUD_BACKEND_URL:-https://api.petsmart.example.com}
      - PG_HOST=postgres
      - PG_DATABASE=smartpet_edge
      - PG_USER=postgres
      - PG_PASSWORD=postgres
      - JWT_SECRET=dev-secret-key
      - API_KEY=smart-pet-api-key-2026
    volumes:
      - ../smart-pet-backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - iot-network
    depends_on:
      - postgres

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pet-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/logs:/mosquitto/logs
    networks:
      - iot-network

  postgres:
    image: postgres:16-alpine
    container_name: pet-edge-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=smartpet_edge
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge
